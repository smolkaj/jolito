<h2>Your Jolito sign-in code</h2>

<p>Enter this 6-digit code in Jolito to sign in:</p>
<p
  style="
    font-size: 32px;
    font-weight: 700;
    letter-spacing: 4px;
    font-family: monospace;
    margin: 16px 0;
    color: #008779;
  "
>
  {{ .Token }}
</p>

<p>Or follow this link to log in automatically:</p>
<p>
  <a
    href="{{ .ConfirmationURL }}"
    style="
      display: inline-block;
      padding: 10px 18px;
      background-color: #008779;
      color: #ffffff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
    "
  >
    Log In to Jolito
  </a>
</p>
