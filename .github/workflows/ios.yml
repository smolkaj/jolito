name: iOS Native Build

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios-build:
    name: Xcode iOS compilation gate
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.10'
          bundler-cache: true
      - run: bundle exec ruby tests/release/release_test.rb
      - run: npm ci --no-audit
      - run: npm run test:release
      - run: npm run build
      - run: npm run cap:sync
      - name: Build Xcode iOS scheme
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            build

  native-screenshots:
    name: Native screenshots (${{ matrix.device }})
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        device: ['iPhone 17 Pro Max', 'iPad Pro 13-inch (M4)']
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      DEVICE_NAME: ${{ matrix.device }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.10'
          bundler-cache: true
      - run: npm ci --no-audit
      - run: npm run build
      - run: npm run cap:sync
      - run: bundle exec ruby scripts/prepare-native-screenshots.rb
      - name: Boot Simulator before launching XCTest
        timeout-minutes: 5
        run: |
          SIMULATOR_UDID=$(xcrun simctl list devices available --json | jq -r --arg name "$DEVICE_NAME" '.devices | to_entries[] | select(.key | endswith("iOS-26-2")) | .value[] | select(.name == $name) | .udid' | head -1)
          test -n "$SIMULATOR_UDID"
          echo "SIMULATOR_UDID=$SIMULATOR_UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIMULATOR_UDID"
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          xcrun simctl status_bar "$SIMULATOR_UDID" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
      - name: Capture the bundled app in Simulator
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme NativeScreenshots \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -configuration Release -resultBundlePath build/screenshots.xcresult \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES test
      - name: Export screenshots
        if: ${{ !cancelled() }}
        run: xcrun xcresulttool export attachments --path build/screenshots.xcresult --output-path build/native-screenshots
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: native-screenshots-${{ matrix.device }}
          path: |
            build/native-screenshots
            build/screenshots.xcresult
          retention-days: 14
