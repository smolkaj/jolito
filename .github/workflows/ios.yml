name: iOS Native Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ios-build:
    name: Xcode iOS compilation gate
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run cap:sync
      - name: Build Xcode iOS scheme
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
