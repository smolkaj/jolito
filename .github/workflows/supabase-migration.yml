name: Database Migrations

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase-migration.yml'
      - 'src/worker/signup-alerts.ts'
      - 'src/worker/email-binding.ts'
      - 'scripts/deploy-signup-alerts.ts'
      - 'scripts/cf-utils.ts'
      - 'wrangler.signup-alerts.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase-migration.yml'
      - 'src/worker/signup-alerts.ts'
      - 'src/worker/email-binding.ts'
      - 'scripts/deploy-signup-alerts.ts'
      - 'scripts/cf-utils.ts'
      - 'wrangler.signup-alerts.json'
      - 'package-lock.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-migrations:
    name: Verify migrations (Local & Lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit

      - name: Start local Supabase and apply migrations
        run: npx supabase start -x realtime,storage-api,imgproxy,studio,logflare,vector,supavisor

      - name: Lint local database schema
        run: npm run lint:db

      - name: Run pgTAP migration and RLS tests
        run: npm run test:db

      - name: Run live integration test suite
        run: npm run test:integration

      - name: Verify remote migration dry-run (if credentials configured)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID || secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_PROJECT_ID" ]; then
            echo "Running remote migration dry-run for project $SUPABASE_PROJECT_ID..."
            npx supabase link --project-ref "$SUPABASE_PROJECT_ID" ${SUPABASE_DB_PASSWORD:+--password "$SUPABASE_DB_PASSWORD"}
            npx supabase db push --linked --dry-run
          else
            echo "Skipping remote dry-run: SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_ID (or SUPABASE_PROJECT_REF) is not configured in repository secrets."
          fi

  deploy-migrations:
    name: Deploy migrations to production Supabase
    needs: [verify-migrations]
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit

      - name: Deploy migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID || secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::warning::Supabase deployment is skipped until secrets (SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_ID / SUPABASE_PROJECT_REF) are configured in repository settings."
            exit 0
          fi
          npx supabase link --project-ref "$SUPABASE_PROJECT_ID" ${SUPABASE_DB_PASSWORD:+--password "$SUPABASE_DB_PASSWORD"}
          npx supabase db push --linked --yes

  deploy-signup-alerts:
    name: Deploy private signup alerts worker
    needs: [deploy-migrations]
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit
      - name: Verify free destination and deploy scheduled worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID || secrets.SUPABASE_PROJECT_REF }}
        run: npm run deploy:signup-alerts
