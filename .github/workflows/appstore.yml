name: App Store Production Deployment

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Configure price/availability, or submit a tested build'
        type: choice
        options: [configure, submit]
        required: true
      build_number:
        description: 'Exact tested build number from the TestFlight release artifact (submit only)'
        required: false

permissions:
  contents: read

concurrency:
  group: apple-release
  cancel-in-progress: false

jobs:
  appstore:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
      APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
      BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.10'
          bundler-cache: true
      - run: bundle exec ruby fastlane/release_config.rb api
      - run: npm ci --no-audit
      - if: inputs.operation == 'configure'
        run: node scripts/app-store.ts --apply
      - if: inputs.operation == 'submit'
        run: |
          node scripts/app-store.ts --check
          bundle exec fastlane ios release build_number:"$BUILD_NUMBER"
